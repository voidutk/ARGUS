services:
  postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus_dev
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - argus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Community edition on purpose. We run Louvain and PageRank in NetworkX on the
  # Python side rather than pulling in the GDS plugin — same results at this data
  # scale, an hour of setup instead of a day. See docs/PLAN.md §4.
  neo4j:
    image: neo4j:5-community
    container_name: argus-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/argus_dev_pw
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"   # Browser — handy for showing judges the raw graph
      - "7687:7687"   # Bolt
    volumes:
      - argus_neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  argus_pgdata:
  argus_neo4jdata:
